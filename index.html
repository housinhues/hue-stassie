<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Huestasie — Housing Hues Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#12140f;--bg-raised:#191c14;--line:#2a2e21;--sage:#9caf6f;--olive:#5c6b3a;--cream:#ece7d9;--muted:#8b8f7c;--alert:#c1603f;--alert-bg:#2a1913;--ok:#7fa17a;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:linear-gradient(var(--bg),var(--bg)),repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(156,175,111,0.035) 40px),repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(156,175,111,0.035) 40px);color:var(--cream);font-family:'Inter',sans-serif;min-height:100vh;padding:0 0 40px 0;}
a{color:var(--sage);}
header{padding:28px clamp(16px,4vw,48px) 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.wordmark{display:flex;align-items:center;gap:12px;}
.wordmark svg{width:34px;height:34px;flex-shrink:0;}
.wordmark h1{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin:0;letter-spacing:0.2px;}
.wordmark h1 span{color:var(--sage);}
.tagline{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-top:2px;}
.header-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.post-now-btn{background:var(--olive);color:var(--cream);border:none;border-radius:40px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s;text-decoration:none;}
.post-now-btn:hover{background:var(--sage);color:#12140f;}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.id-picker{display:flex;gap:7px;}
.id-btn{position:relative;width:34px;height:34px;border-radius:5px;background:var(--bg-raised);border:1px solid var(--line);color:var(--id-c);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s ease, border-color .12s ease;}
.id-btn:hover{border-color:var(--id-c);transform:translateY(-1px);}
.id-btn.active{background:var(--id-c);color:#0c0d09;border-color:var(--id-c);box-shadow:0 0 0 1px var(--id-c), 0 0 14px -2px var(--id-c);}
.active-name{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cream);}
main{padding:28px clamp(16px,4vw,48px);max-width:1440px;margin:0 auto;}
.greeting-banner{--id-c:#9caf6f;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 22px;margin-bottom:22px;border-radius:12px;background:linear-gradient(120deg, rgba(156,175,111,0.10), rgba(156,175,111,0.02));border:1px solid var(--id-c);box-shadow:0 0 24px -8px var(--id-c);}
.greeting-emoji{font-size:26px;line-height:1;}
.greeting-phrase{font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:var(--id-c);}
.greeting-role{font-size:13px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.vibe-badge{--vibe-c:#9caf6f;display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:color-mix(in srgb, var(--vibe-c) 18%, transparent);color:var(--vibe-c);border:1px solid var(--vibe-c);font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;}
.feed-scope-label{color:var(--sage);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;}
.insta-profile-card{--id-c:#9caf6f;display:flex;align-items:center;gap:14px;padding:20px;border-radius:10px;background:linear-gradient(120deg, color-mix(in srgb, var(--id-c) 14%, transparent), transparent);border:1px solid var(--id-c);}
.insta-avatar{width:46px;height:46px;border-radius:50%;background:var(--id-c);color:#0c0d09;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.insta-info{flex:1;}
.insta-handle{font-family:'Fraunces',serif;font-size:16px;font-weight:500;}
.insta-name{font-size:12px;color:var(--muted);}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:10px;}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr;}}
.glass{background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:24px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:'Fraunces',serif;font-weight:500;font-size:18px;}
.card-header i{color:var(--sage);margin-right:8px;}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.proj-card{background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;}
.proj-card.urgent{border-color:var(--alert);}
.proj-name{font-family:'Fraunces',serif;font-size:17px;font-weight:500;background:transparent;border:none;color:var(--cream);padding:0;width:100%;}
.proj-name:focus{outline:none;border-bottom:1px solid var(--sage);}
.row-label{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-top:4px;}
.proj-card select,.proj-card input,.proj-card textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--cream);border-radius:6px;padding:6px 8px;font-size:12px;font-family:'Inter',sans-serif;}
.proj-card textarea{min-height:40px;resize:vertical;}
.social-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.social-row a{color:var(--muted);font-size:18px;transition:color .15s, transform .15s;}
.social-row a:hover{color:var(--sage);transform:translateY(-2px);}
.workload-input{display:flex;align-items:center;gap:10px;}
.workload-input input[type="number"]{width:60px;padding:4px 6px;}
.subtask-list{list-style:none;padding:0;margin:4px 0 0;}
.subtask-list li{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.subtask-list li.done .subtask-text{text-decoration:line-through;color:var(--muted);}
.subtask-text{flex:1;background:transparent;border:none;color:var(--cream);font-size:13px;padding:2px 0;}
.subtask-text:focus{outline:none;border-bottom:1px solid var(--sage);}
.add-subtask{display:flex;gap:6px;margin-top:6px;}
.add-subtask input{flex:1;padding:4px 8px;font-size:12px;}
.workload-panel{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:700px){.workload-panel{grid-template-columns:1fr;}}
.workload-table{width:100%;border-collapse:collapse;font-size:13px;}
.workload-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);}
.workload-table td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,0.05);}
.wl-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:inline-block;width:80px;}
.wl-bar span{display:block;height:100%;background:var(--sage);border-radius:3px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.03);border-radius:6px;font-size:13px;cursor:pointer;transition:background .12s;font-family:'JetBrains Mono',monospace;}
.cal-day:hover{background:rgba(156,175,111,0.2);}
.cal-day.has-event{color:var(--sage);font-weight:700;}
.cal-day.other-month{color:var(--muted);opacity:0.4;}
.cal-day.selected{background:var(--olive);color:#12140f;}
.event-list{margin-top:12px;}
.event-item{background:rgba(156,175,111,0.08);border-left:3px solid var(--sage);padding:8px 12px;border-radius:4px;margin-bottom:6px;font-size:13px;}
.event-item .time{color:var(--muted);font-size:11px;}
.event-item .del-ev{cursor:pointer;float:right;color:var(--muted);}
.event-item .del-ev:hover{color:var(--alert);}
.add-event-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.add-event-form input,.add-event-form textarea{padding:6px 10px;background:var(--bg);border:1px solid var(--line);color:var(--cream);border-radius:6px;font-size:12px;font-family:'Inter',sans-serif;}
.add-event-form textarea{grid-column:1 / -1;min-height:40px;}
.embed-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.embed-grid{grid-template-columns:1fr;}}
.embed-box iframe{width:100%;min-height:400px;border:none;border-radius:8px;}
.btn{background:var(--olive);color:var(--cream);border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s;}
.btn:hover{background:var(--sage);color:#12140f;}
.btn-sm{font-size:11px;padding:4px 10px;}
.del-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px;}
.del-x:hover{color:var(--alert);}
.empty{color:var(--muted);font-size:13px;padding:20px;text-align:center;font-style:italic;}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>
<header>
  <div>
    <div class="wordmark">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="#9caf6f" stroke-width="1"/><circle cx="20" cy="10" r="2.4" fill="#9caf6f"/><circle cx="12" cy="26" r="2.4" fill="#9caf6f"/><circle cx="28" cy="26" r="2.4" fill="#9caf6f"/><path d="M20 10 L12 26 L28 26 Z" stroke="#5c6b3a" stroke-width="1.1" fill="none"/><circle cx="20" cy="21" r="1.6" fill="#ece7d9"/></svg>
      <div><h1>hues<span>tasie</span></h1><div class="tagline">Housing Hues Dashboard</div></div>
    </div>
  </div>
  <div class="header-actions">
    <a href="https://www.instagram.com/" target="_blank" class="post-now-btn"><i class="fas fa-plus-circle"></i> Post Now</a>
    <div class="who">
      <span class="active-name" id="activeName"></span>
      <div class="id-picker" id="idPicker"></div>
    </div>
  </div>
</header>
<main>
  <div class="greeting-banner" id="greetingBanner"></div>
  <div class="dash-grid">
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0;"><i class="fas fa-layer-group" style="color:var(--sage);"></i> Projects</h2>
        <button class="btn" id="addProjectBtn">+ New Project</button>
      </div>
      <div class="proj-grid" id="projectGrid"></div>
    </div>
    <div>
      <div class="glass">
        <div class="card-header"><i class="fas fa-chart-pie"></i> Workload</div>
        <div class="workload-panel">
          <div><canvas id="workloadChart" width="200" height="200"></canvas></div>
          <div><table class="workload-table" id="wlTable"><tbody></tbody></table></div>
        </div>
      </div>
      <div class="glass">
        <div class="card-header"><i class="fas fa-calendar-alt"></i> Calendar</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
          <button class="btn btn-sm" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
          <span id="calMonthYear" style="font-family:'Fraunces',serif;font-size:16px;"></span>
          <button class="btn btn-sm" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="event-list" id="eventList"></div>
        <div class="add-event-form">
          <input id="evTitle" placeholder="Event title (e.g. SuperFly meet)">
          <input id="evTime" type="datetime-local">
          <input id="evWith" placeholder="With whom (e.g. Lesego)">
          <input id="evDate" type="date" style="grid-column:1 / -1;">
          <textarea id="evMemo" placeholder="Memo / notes..."></textarea>
          <button class="btn" onclick="addEvent()" style="grid-column:1 / -1;">Add Event</button>
        </div>
      </div>
    </div>
  </div>
  <div style="margin-top:28px;">
    <div class="embed-grid">
      <div class="glass">
        <div class="card-header"><i class="fab fa-facebook"></i> Facebook Feed — <span id="fbFeedLabel" class="feed-scope-label"></span></div>
        <input id="fbPageUrl" placeholder="Paste this profile's Facebook Page URL" style="width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--line);color:var(--cream);border-radius:6px;font-size:12px;margin-bottom:10px;" onchange="updateFacebookEmbed()">
        <div class="embed-box" id="fbEmbedContainer"></div>
      </div>
      <div class="glass">
        <div class="card-header"><i class="fab fa-instagram"></i> Instagram — <span id="igFeedLabel" class="feed-scope-label"></span></div>
        <div id="instaProfileCard"></div>
      </div>
    </div>
  </div>
</main>
<script>
const STORAGE_KEY = 'hh-unified-data';
const IDENTITIES = [
  {name:'ntate.mongale', letter:'N', color:'#33e0ff', greeting:'Eya Ntate Mongale', emoji:'🧘🏾', role:'Personal', instagram:'https://www.instagram.com/ntate.mongale', facebook:''},
  {name:'Housing Hues',  letter:'H', color:'#b6ff3c', greeting:'Yessir', emoji:'🫡', role:"I'm Agentic here", instagram:'https://www.instagram.com/housinghues', facebook:'https://www.facebook.com/HousingHues'},
  {name:'Clean Totty',   letter:'C', color:'#ff2e88', greeting:'Ayy, Fresh', emoji:'🧼', role:'Keeping it clean (placeholder — send your line)', instagram:'https://www.instagram.com/cleantotty', facebook:''},
  {name:'DMNT',          letter:'D', color:'#ff9500', greeting:'Tapped in sir?', emoji:'🌐', role:'Internet cafe', instagram:'https://www.instagram.com/don_mention_it', facebook:''},
  {name:'Vuks',          letter:'V', color:'#a45cff', greeting:'GREETINGS', emoji:'🎓', role:"I'm academically tapped in", instagram:'https://www.instagram.com/vuselelatvetcollege', facebook:''},
  {name:'Music Xhefs',   letter:'M', color:'#00ff88', greeting:'Waddup Chef', emoji:'🎧', role:'Music production (placeholder — send socials)', instagram:'', facebook:''},
  {name:'018 Productions', letter:'0', color:'#ff3b3b', greeting:'Fede Whuzet', emoji:'🎬', role:"I'm a creative director here", instagram:'https://www.instagram.com/018productions', facebook:''}
];
const VIBE_LEVELS = [
  {key:'urgent',     label:'Yasslike',       emoji:'🤧', color:'#ff3b3b'},
  {key:'loaded',     label:'Moeski',         emoji:'😤', color:'#ff9500'},
  {key:'manageable', label:'Noh',            emoji:'😐', color:'#fad165'},
  {key:'progress',   label:'Tjo',            emoji:'😶', color:'#9caf6f'},
  {key:'almost',     label:'Yerr, at least', emoji:'😌', color:'#43d692'},
  {key:'done',       label:'Danko',          emoji:'🫡', color:'#16a766'}
];
function computeVibe(p){
  const subs = p.subtasks || [];
  const total = subs.length;
  const done = subs.filter(s=>s.done).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  if(total>0 && pct>=100) return VIBE_LEVELS[5];
  if(p.priority==='urgent' && p.status==='blocked') return VIBE_LEVELS[0];
  if(pct>=75) return VIBE_LEVELS[4];
  if(pct>=40) return VIBE_LEVELS[3];
  if((p.workload||0)>=20 && pct<40) return VIBE_LEVELS[1];
  return VIBE_LEVELS[2];
}
const DEFAULT_PROJECTS = [
  {id:'p1',name:'True Organics', identity:'Housing Hues', status:'blocked', priority:'urgent', nextAction:'Resolve website delay', notes:'Client paid ~R1000 extra', workload:25, subtasks:[{id:'s1',text:'Resolve website delay',done:false},{id:'s2',text:'Send exit threat response',done:false}]},
  {id:'p2',name:'SuperFly (Sept)', identity:'Housing Hues', status:'active', priority:'normal', nextAction:'Keep artist roster', notes:'4-day event', workload:30, subtasks:[{id:'s3',text:'Confirm artists',done:true},{id:'s4',text:'Schedule logistics',done:false}]},
  {id:'p3',name:'Indigo Edit v2', identity:'Housing Hues', status:'blocked', priority:'urgent', nextAction:'Deliver demo', notes:'Batch editing validation', workload:15, subtasks:[{id:'s5',text:'Render demo',done:false}]},
  {id:'p4',name:'Kota order system', identity:'Housing Hues', status:'pending', priority:'normal', nextAction:'Confirm shop name', notes:'Mobile trailer', workload:10, subtasks:[{id:'s6',text:'Design menu',done:true}]},
  {id:'p5',name:'Olgeit (Marriza)', identity:'Housing Hues', status:'active', priority:'normal', nextAction:'Content strategy', notes:'50/50 split', workload:8, subtasks:[]},
  {id:'p6',name:'Batch editing pipeline', identity:'018 Productions', status:'blocked', priority:'normal', nextAction:'Unblock batch editing', notes:'2+ months stalled', workload:7, subtasks:[]},
  {id:'p7',name:'D.U.C Tour', identity:'Housing Hues', status:'active', priority:'normal', nextAction:'Support collabs', notes:'Event planning', workload:3, subtasks:[]},
  {id:'p8',name:'Vuselela TVET', identity:'Vuks', status:'pending', priority:'normal', nextAction:'Follow up call', notes:'Proposal submitted', workload:2, subtasks:[]}
];
let data = { projects:[], tasks:[], events:[], instaMode:'publer', activeIdentity:IDENTITIES[0].name };
let calDate = new Date();
let workloadChart = null;
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }
async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ data = JSON.parse(raw); }
    else {
      data.projects = DEFAULT_PROJECTS.map(p=>({...p, subtasks:p.subtasks.map(s=>({...s}))}));
      data.events = [];
      data.instaMode = 'publer';
      data.activeIdentity = IDENTITIES[0].name;
    }
  }catch(e){ console.warn('Storage load fallback', e); }
  renderAll();
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){ console.warn('Save failed', e); } }
function renderAll(){ renderIdentity(); renderProjects(); renderWorkload(); renderCalendar(); renderEvents(); renderInstagram(); renderFacebook(); }
function renderIdentity(){
  const picker = document.getElementById('idPicker');
  picker.innerHTML = IDENTITIES.map(id => `
    <button class="id-btn ${id.name===data.activeIdentity?'active':''}" style="--id-c:${id.color}" onclick="setIdentity('${id.name}')">${id.letter}</button>
  `).join('');
  document.getElementById('activeName').textContent = data.activeIdentity;
  renderGreeting();
}
function renderGreeting(){
  const el = document.getElementById('greetingBanner');
  if(!el) return;
  const id = IDENTITIES.find(i=>i.name===data.activeIdentity);
  if(!id){ el.innerHTML=''; return; }
  el.innerHTML = `<span class="greeting-emoji">${id.emoji}</span><span class="greeting-phrase">${escHtml(id.greeting)}</span><span class="greeting-role">${escHtml(id.role)}</span>`;
  el.style.setProperty('--id-c', id.color);
}
function setIdentity(name){ data.activeIdentity = name; save(); renderAll(); }
function renderProjects(){
  const grid = document.getElementById('projectGrid');
  const scoped = data.projects.filter(p => p.identity === data.activeIdentity);
  if(!scoped.length){ grid.innerHTML=`<div class="empty">No projects yet for ${escHtml(data.activeIdentity)}. Add one below.</div>`; return; }
  grid.innerHTML = scoped.map(p => {
    const vibe = computeVibe(p);
    return `
    <div class="proj-card ${p.priority==='urgent'?'urgent':''}">
      <div class="vibe-badge" style="--vibe-c:${vibe.color}">${vibe.emoji} ${vibe.label}</div>
      <input class="proj-name" value="${escAttr(p.name)}" onchange="updateProj('${p.id}','name',this.value)">
      <div>
        <select onchange="updateProj('${p.id}','status',this.value)">
          ${['active','blocked','pending'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select onchange="updateProj('${p.id}','priority',this.value)" style="margin-left:6px;">
          ${['normal','urgent'].map(s=>`<option value="${s}" ${p.priority===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div><div class="row-label">Next action</div><input value="${escAttr(p.nextAction||'')}" onchange="updateProj('${p.id}','nextAction',this.value)"></div>
      <div><div class="row-label">Notes</div><textarea onchange="updateProj('${p.id}','notes',this.value)">${escHtml(p.notes||'')}</textarea></div>
      <div class="workload-input">
        <span class="row-label">Workload %</span>
        <input type="number" min="0" max="100" value="${p.workload||0}" onchange="updateProj('${p.id}','workload',Number(this.value))">
      </div>
      <div><div class="row-label">Subtasks</div>
        <ul class="subtask-list" id="subtasks-${p.id}">
          ${(p.subtasks||[]).map(s => `
            <li class="${s.done?'done':''}">
              <input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask('${p.id}','${s.id}')">
              <input class="subtask-text" value="${escAttr(s.text)}" onchange="updateSubtaskText('${p.id}','${s.id}',this.value)">
              <button class="del-x" onclick="deleteSubtask('${p.id}','${s.id}')">✕</button>
            </li>`).join('')}
        </ul>
        <div class="add-subtask">
          <input id="newSub-${p.id}" placeholder="Add subtask..." onkeydown="if(event.key==='Enter')addSubtask('${p.id}')">
          <button class="btn btn-sm" onclick="addSubtask('${p.id}')">+</button>
        </div>
      </div>
      <div class="social-row">
        <a href="#" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        <a href="#" target="_blank" title="Email"><i class="fas fa-envelope"></i></a>
        <a href="#" target="_blank" title="Drive"><i class="fas fa-folder-open"></i></a>
        <a href="#" target="_blank" title="Website"><i class="fas fa-globe"></i></a>
        <button class="del-x" onclick="deleteProject('${p.id}')" style="margin-left:auto;">✕</button>
      </div>
    </div>
  `;
  }).join('');
}
async function updateProj(id, field, value){
  const p = data.projects.find(p=>p.id===id); if(!p) return;
  p[field] = value;
  if(field==='workload'){ p.workload = Math.min(100, Math.max(0, Number(value)||0)); }
  save(); renderWorkload(); if(field==='name') renderProjects();
}
async function deleteProject(id){
  data.projects = data.projects.filter(p=>p.id!==id);
  data.tasks = data.tasks.filter(t=>t.projectId!==id);
  save(); renderAll();
}
document.getElementById('addProjectBtn').addEventListener('click', ()=>{
  data.projects.push({id:uid(),name:'New project',identity:data.activeIdentity,status:'pending',priority:'normal',nextAction:'',notes:'',workload:0,subtasks:[]});
  save(); renderAll();
});
function addSubtask(pid){
  const inp = document.getElementById(`newSub-${pid}`);
  if(!inp||!inp.value.trim()) return;
  const p = data.projects.find(p=>p.id===pid); if(!p) return;
  p.subtasks.push({id:uid(), text:inp.value.trim(), done:false});
  inp.value='';
  save(); renderProjects(); renderWorkload();
}
function toggleSubtask(pid, sid){
  const p = data.projects.find(p=>p.id===pid); if(!p) return;
  const s = p.subtasks.find(s=>s.id===sid); if(!s) return;
  s.done = !s.done;
  save(); renderProjects(); renderWorkload();
}
function updateSubtaskText(pid, sid, val){
  const p = data.projects.find(p=>p.id===pid); if(!p) return;
  const s = p.subtasks.find(s=>s.id===sid); if(!s) return;
  s.text = val;
  save(); renderProjects();
}
function deleteSubtask(pid, sid){
  const p = data.projects.find(p=>p.id===pid); if(!p) return;
  p.subtasks = p.subtasks.filter(s=>s.id!==sid);
  save(); renderProjects(); renderWorkload();
}
const centerTextPlugin = {
  id:'centerText',
  beforeDraw(chart){
    const {ctx, chartArea} = chart;
    if(!chartArea) return;
    const total = chart.data.datasets[0].data.reduce((a,b)=>a+b,0);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const cx = (chartArea.left+chartArea.right)/2;
    const cy = (chartArea.top+chartArea.bottom)/2;
    ctx.font = "600 22px 'Fraunces', serif";
    ctx.fillStyle = '#ece7d9';
    ctx.fillText(total+'%', cx, cy-8);
    ctx.font = "10px 'Inter', sans-serif";
    ctx.fillStyle = '#8b8f7c';
    ctx.fillText('TOTAL LOAD', cx, cy+13);
    ctx.restore();
  }
};
function renderWorkload(){
  const projects = data.projects.filter(p => p.identity===data.activeIdentity && (p.workload||0) > 0);
  const labels = projects.map(p=>p.name);
  const values = projects.map(p=>p.workload||0);
  const total = values.reduce((a,b)=>a+b,0) || 1;
  const activeId = IDENTITIES.find(i=>i.name===data.activeIdentity);
  const baseColor = (activeId && activeId.color) || '#9caf6f';
  const palette = [baseColor,'#5c6b3a','#7fa17a','#c1603f','#a45cff','#ff9500','#33e0ff','#ff2e88'];
  const tbody = document.querySelector('#wlTable tbody');
  tbody.innerHTML = projects.map(p => {
    const done = (p.subtasks||[]).filter(s=>s.done).length;
    const totalS = (p.subtasks||[]).length;
    const pct = totalS ? Math.round((done/totalS)*100) : 0;
    const barW = Math.round((p.workload/total)*100);
    return `<tr><td>${escHtml(p.name)}</td><td>${p.workload}%</td><td><div class="wl-bar"><span style="width:${barW}%"></span></div></td><td>${pct}% done</td></tr>`;
  }).join('') || `<tr><td colspan="4" style="color:var(--muted);padding:12px;">No workload data for ${escHtml(data.activeIdentity)} yet.</td></tr>`;
  const ctx = document.getElementById('workloadChart').getContext('2d');
  if(workloadChart) workloadChart.destroy();
  workloadChart = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data:values, backgroundColor:palette, borderColor:'#191c14', borderWidth:2, hoverOffset:6 }] },
    plugins:[centerTextPlugin],
    options:{ responsive:true, cutout:'70%', plugins:{ legend:{ position:'bottom', labels:{ color:'#ece7d9', font:{size:10} } } } }
  });
}
function renderCalendar(){
  const year = calDate.getFullYear(), month = calDate.getMonth();
  const first = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date().getDate();
  const todayMonth = new Date().getMonth();
  const todayYear = new Date().getFullYear();
  document.getElementById('calMonthYear').textContent = new Date(year, month).toLocaleString('default', { month:'long', year:'numeric' });
  const grid = document.getElementById('calGrid');
  let html = '';
  for(let i=0; i<first; i++) html += `<div class="cal-day other-month"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = data.events.some(e=>e.date===dateStr);
    const isToday = (d===today && month===todayMonth && year===todayYear);
    html += `<div class="cal-day ${has?'has-event':''} ${isToday?'selected':''}" onclick="selectDate('${dateStr}')">${d}</div>`;
  }
  grid.innerHTML = html;
  renderEvents();
}
function changeMonth(delta){ calDate.setMonth(calDate.getMonth()+delta); renderCalendar(); }
function selectDate(dateStr){ document.getElementById('evDate').value = dateStr; renderEvents(); }
function renderEvents(){
  const dateStr = document.getElementById('evDate').value || new Date().toISOString().split('T')[0];
  const list = document.getElementById('eventList');
  const filtered = data.events.filter(e=>e.date===dateStr);
  if(!filtered.length){ list.innerHTML = '<div class="empty">No events for this date.</div>'; return; }
  list.innerHTML = filtered.map(e => `
    <div class="event-item">
      <strong>${escHtml(e.title)}</strong>
      <span class="time">${e.time||''} · with ${e.with||'—'}</span>
      <button class="del-ev" onclick="deleteEvent('${e.id}')">✕</button>
      <div style="font-size:12px;color:var(--muted);margin-top:4px;">${escHtml(e.memo||'')}</div>
    </div>
  `).join('');
}
function addEvent(){
  const title = document.getElementById('evTitle').value.trim();
  const time = document.getElementById('evTime').value;
  const withWhom = document.getElementById('evWith').value.trim();
  const date = document.getElementById('evDate').value;
  const memo = document.getElementById('evMemo').value.trim();
  if(!title || !date){ alert('Title and date required.'); return; }
  data.events.push({id:uid(), title, time, with:withWhom, date, memo});
  save();
  document.getElementById('evTitle').value='';
  document.getElementById('evTime').value='';
  document.getElementById('evWith').value='';
  document.getElementById('evMemo').value='';
  renderCalendar();
}
function deleteEvent(id){ data.events = data.events.filter(e=>e.id!==id); save(); renderCalendar(); }
function getIdentityData(name){ return IDENTITIES.find(i=>i.name===name); }
function renderFacebook(){
  const id = getIdentityData(data.activeIdentity);
  const labelEl = document.getElementById('fbFeedLabel');
  if(labelEl) labelEl.textContent = data.activeIdentity;
  const saved = (data.customFacebook||{})[data.activeIdentity];
  const url = saved || (id && id.facebook) || '';
  const input = document.getElementById('fbPageUrl');
  if(input) input.value = url;
  const container = document.getElementById('fbEmbedContainer');
  if(!container) return;
  if(!url){
    container.innerHTML = `<p style="color:var(--muted);font-size:13px;padding:16px 0;">No Facebook Page linked for ${escHtml(data.activeIdentity)} yet — paste one above.</p>`;
    return;
  }
  const encoded = encodeURIComponent(url);
  container.innerHTML = `<iframe src="https://www.facebook.com/plugins/page.php?href=${encoded}&tabs=timeline&width=340&height=400&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=true&appId" width="100%" height="400" style="border:none;overflow:hidden;" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
}
function updateFacebookEmbed(){
  const url = document.getElementById('fbPageUrl').value.trim();
  if(!data.customFacebook) data.customFacebook = {};
  data.customFacebook[data.activeIdentity] = url;
  save();
  renderFacebook();
}
function igHandle(url){
  try{ const u = new URL(url); return '@' + u.pathname.replace(/\//g,''); }
  catch(e){ return url; }
}
function renderInstagram(){
  const id = getIdentityData(data.activeIdentity);
  const labelEl = document.getElementById('igFeedLabel');
  if(labelEl) labelEl.textContent = data.activeIdentity;
  const container = document.getElementById('instaProfileCard');
  if(!container) return;
  if(!id || !id.instagram){
    container.innerHTML = `<p style="color:var(--muted);font-size:13px;padding:16px 0;">No Instagram linked for ${escHtml(data.activeIdentity)}.</p>`;
    return;
  }
  container.innerHTML = `
    <div class="insta-profile-card" style="--id-c:${id.color}">
      <div class="insta-avatar">${id.letter}</div>
      <div class="insta-info">
        <div class="insta-handle">${escHtml(igHandle(id.instagram))}</div>
        <div class="insta-name">${escHtml(id.name)}</div>
      </div>
      <a href="${escAttr(id.instagram)}" target="_blank" class="btn btn-sm"><i class="fab fa-instagram"></i> Open</a>
    </div>`;
}
load();
</script>
